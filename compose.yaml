services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: checkout
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout -d checkout"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://checkout:checkout@db:5432/checkout
      REWARD_EVERY_N: ${REWARD_EVERY_N:-5}
      REWARD_DISCOUNT_PERCENT: ${REWARD_DISCOUNT_PERCENT:-10}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.db.seed"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://checkout:checkout@db:5432/checkout
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  tests:
    profiles: ["test"]
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://checkout:checkout@db:5432/checkout_test
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && pytest -q"

  demo:
    profiles: ["demo"]
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://checkout:checkout@db:5432/checkout_demo
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m scripts.prepare_demo && alembic upgrade head && python -m scripts.demo"

volumes:
  postgres_data:
